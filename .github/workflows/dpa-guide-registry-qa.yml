name: DPA Guide Registry and Browser QA

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guide-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate all chapter guide mappings
        run: node scripts/validate-dpa-guide-registry.js

      - name: Install isolated browser test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/dpa-chapter-browser"
          cd "$RUNNER_TEMP/dpa-chapter-browser"
          npm init -y
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Start local curriculum server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/dpa-chapter-http.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              echo "Curriculum server is ready."
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/dpa-chapter-http.log"
          exit 1

      - name: Verify rendered materials and role switching in Chromium
        run: NODE_PATH="$RUNNER_TEMP/dpa-chapter-browser/node_modules" node scripts/test-dpa-chapter-rendering.cjs
